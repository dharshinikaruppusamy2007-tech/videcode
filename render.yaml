services:
  - type: web
    name: videcode-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: GEMINI_API_KEY
        sync: false          # You will set this manually in the Render dashboard
      - key: FRONTEND_URL
        value: https://dharshinikaruppusamy2007-tech.github.io
